name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      auto_recover:
        description: 'Triggered by guardian auto-recovery'
        required: false
        default: 'false'
        type: boolean
      recover_reason:
        description: 'Why the previous run stopped'
        required: false
        default: 'manual'
        type: string

# 不取消进行中的任务 — 新触发会排队，避免误中断
concurrency:
  group: ios-unsigned-ipa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Recovery info
        if: inputs.auto_recover == true
        run: |
          echo "Auto-recover build. Previous stop reason: ${{ inputs.recover_reason }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup build config
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Install build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libarchive)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix libarchive)/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix libarchive)/include" >> "$GITHUB_ENV"

      - name: Restore native dependency cache
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-native-deps-v2-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh') }}
          restore-keys: |
            openminis-native-deps-v2-

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            chmod +x deps/build_lame.sh deps/build_ffmpeg.sh deps/build_ish.sh deps/prepare_alpine_rootfs.sh
            ./deps/build_lame.sh
            ./deps/build_ffmpeg.sh &
            ./deps/build_ish.sh &
            ./deps/prepare_alpine_rootfs.sh &
            wait

      - name: Save native dependency cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: openminis-native-deps-v2-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh') }}

      - name: Build app without signing
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 45
          command: |
            JOBS=$(sysctl -n hw.ncpu)
            xcodebuild build \
              -project src/ios/Minis.xcodeproj \
              -scheme Minis \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/DerivedData" \
              -jobs "$JOBS" \
              -parallelizeTargets \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "Minis.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Minis.app not found"
            find "$RUNNER_TEMP/DerivedData" -name "*.app" || true
            exit 1
          fi
          echo "Found app: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr OpenMinis-unsigned.ipa Payload
          ls -lh OpenMinis-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-unsigned-ipa
          path: ${{ runner.temp }}/OpenMinis-unsigned.ipa
          retention-days: 14
